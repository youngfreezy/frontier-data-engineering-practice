[project]
name = "frontier-data-engineering-toolkit"
version = "0.1.0"
description = "A dependency-free control plane and skill for frontier data-engineering evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
frontier-control-plane = "frontier_control_plane.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["frontier_control_plane*"]
